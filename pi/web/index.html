<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>MagicBoxie Player</title>
<link rel="icon" type="image/png" sizes="64x64" href="/static/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header><span class="logo">MagicBoxie</span><span class="right"><span id="conn">Connecting…</span>
<button id="busy" class="busy hidden" aria-label="Downloads" title="Downloads"><span class="spin" aria-hidden="true"></span></button>
<button id="gear" class="gear" aria-label="Device settings"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></span></header>
<main>
<section class="hero hidden" id="hero"><img id="heroImg" alt=""><div class="info"><div class="label">Now playing</div><div class="title" id="heroTitle"></div></div></section>
<input id="search" type="search" placeholder="Search movies" aria-label="Search movies" autocomplete="off">
<div class="sectionhead"><h2>Movies</h2>
<button id="upload" class="btn red small">+ Upload</button>
<input id="file" type="file" accept="video/*,.mkv,.avi,.mov,.m4v,.mp4,.webm" multiple hidden></div>
<div id="uploads"></div>
<div id="grid"><div class="empty">Loading movies…</div></div>
</main>
<div id="sheet" class="hidden" role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>
<div id="bar" class="hidden">
<div class="top"><div class="t" id="barTitle"></div>
<button class="ic s" id="back" aria-label="Back 15 seconds">⟲</button>
<button class="ic" id="toggle" aria-label="Play or pause">❚❚</button>
<button class="ic s" id="fwd" aria-label="Forward 15 seconds">⟳</button>
<button class="ic s" id="stop" aria-label="Stop">■</button></div>
<input id="seek" type="range" min="0" max="0" value="0" aria-label="Seek">
<div id="toast" role="status"></div>
</div>
<script src="/static/app.js"></script>
</body></html>
